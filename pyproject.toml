[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "RAG-HPO"
dynamic = ["version"]
description = "HPO RAG as implemented by Brandon T. Garcia 2025."
authors = [{ name = "Rouven Reuter" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# Core: everything needed for LLMClient (OpenAI-compatible endpoint) + FAISS retrieval.
# Heavy ML stacks (torch, onnxruntime) live in extras so a plain install stays small.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "pronto>=2.5",
    "faiss-cpu>=1.9",
    "rapidfuzz>=3.0",
    "tabulate>=0.9",
    "requests>=2.31",
    "tiktoken>=0.7",
    "threadpoolctl>=3.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Embedding backends (pick one)
sentence-transformers = ["sentence-transformers>=3.0"]
fastembed = ["fastembed>=0.4"]
# Run a Hugging Face model in-process via LocalLLMClient
local-llm = ["transformers>=4.45", "torch>=2.2", "accelerate>=0.26"]
all = ["RAG-HPO[sentence-transformers,fastembed,local-llm]"]
dev = [
    "RAG-HPO[all]",
    "ruff==0.17.3",
    "pytest>=8",
]

[project.urls]
homepage = "https://www.smart-monkey.blog/"
repository = "https://github.com/P2GX/RAG-HPO"
documentation = "https://github.com/P2GX/RAG-HPO"
bugtracker = "https://github.com/P2GX/RAG-HPO/issues"

[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools.package-data]
rag_hpo = ["data/*.csv"]

[tool.setuptools_scm]
version_file = "src/rag_hpo/_version.py"

[tool.pytest.ini_options]
addopts = "-s"