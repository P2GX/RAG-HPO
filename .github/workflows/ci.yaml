name: CI

on:
  pull_request:

permissions:
      id-token: write
      contents: read

env:
    PYTEST_ADDOPTS: "--color=yes"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ruff Formatting
      uses: astral-sh/ruff-action@v3.5.0
      with:
        version-file: "pyproject.toml"
        args: "format --check"


  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ruff Linting
      uses: astral-sh/ruff-action@v3.5.0
      with:
        version-file: "pyproject.toml"